# CI: typecheck, build, and the Chrome-free test suite.
#
# The README status badge points at this workflow file.
#
# Six integration tests drive a real Google Chrome (the local service's own
# chromeless `--app` window) and therefore need a Chrome install plus a clean set
# of throwaway profiles:
#   tests/browser.test.ts          tests/provider.test.ts
#   tests/live-canvas-browser.test.ts   tests/live-canvas-breaker.test.ts
#   tests/fit-page-browser.test.ts      tests/fit-page-breaker.test.ts
#   tests/nova-canvas-breaker.test.ts
# On a CI runner (and on any machine whose Chrome profiles are stale or locked)
# they fail for environment reasons rather than because the code regressed, so
# they are excluded here. nova-canvas-breaker additionally holds the qualified
# wheel-anchor reproducer (N3), a known defect pending its bounded fix. Run
# them locally with:
#   npm test -- tests/browser.test.ts tests/provider.test.ts
#   npm test -- tests/live-canvas-browser.test.ts tests/live-canvas-breaker.test.ts \
#               tests/fit-page-browser.test.ts tests/fit-page-breaker.test.ts \
#               tests/nova-canvas-breaker.test.ts
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Explicit file list rather than a name filter: Node's test runner takes
      # globs, not exclusions, so we expand the set with find and pass it on.
      - name: Test (excluding the Chrome-dependent integration tests)
        run: node --test --test-concurrency=1 $(find tests -name '*.test.ts' ! -name 'browser.test.ts' ! -name 'provider.test.ts' ! -name 'live-canvas-browser.test.ts' ! -name 'live-canvas-breaker.test.ts' ! -name 'fit-page-browser.test.ts' ! -name 'fit-page-breaker.test.ts' ! -name 'nova-canvas-breaker.test.ts' | sort)
