name: Bug report
description: Report a defect in OpenChamber Design Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please check that the issue is
        in Design Studio itself: defects in OpenChamber belong to the OpenChamber
        project (see the link in the issue chooser).

        Redact anything private from logs and picks before you paste it.

  - type: input
    id: openchamber-version
    attributes:
      label: OpenChamber version
      description: Version shown in OpenChamber settings (Design Studio needs >= 2.2.0).
      placeholder: "e.g. 2.2.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and version you run OpenChamber on.
      placeholder: "e.g. macOS 15.1"
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: The Google Chrome the extension drives (visit chrome://version, or report the bundle version).
      placeholder: "e.g. 141.0.7390.55"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      description: How you installed the extension.
      options:
        - git
        - folder
        - zip
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact steps that reproduce the bug, starting from a known state.
      placeholder: |
        1. Open the Design Studio panel
        2. Open the URL ...
        3. Turn on Pick and click ...
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened. Include error text or a screenshot if you have one.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant, such as the project's .design-studio.json (redacted) or the service log.
    validations:
      required: false
